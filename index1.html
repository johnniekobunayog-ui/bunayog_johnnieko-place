<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest a Place</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .form-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label,
        legend {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .form-group > label {
            display: block;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #222;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        fieldset {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        legend {
            padding: 0 8px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: normal;
        }

        .option:last-child {
            margin-bottom: 0;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #444;
            transform: translateY(-2px);
        }

        .required {
            color: #d00;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .form-header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="form-card">

            <div class="form-header">
                <h1>📍 Suggest-a-Place</h1>
                <p>
                    Know a great place that should be added to our guide?
                    Share your recommendation with us!
                </p>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="place-name">
                        Place Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="place-name"
                        name="place_name"
                        placeholder="Enter the name of the place"
                        required
                    >
                </div>

                <div class="form-group">
                    <fieldset>
                        <legend>
                            Category <span class="required">*</span>
                        </legend>

                        <label class="option">
                            <input
                                type="radio"
                                name="category"
                                value="food"
                                required
                            >
                            Food
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="category"
                                value="study-spot"
                            >
                            Study Spot
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="category"
                                value="outdoors"
                            >
                            Outdoors
                        </label>
                    </fieldset>
                </div>

                <div class="form-group">
                    <fieldset>
                        <legend>
                            What's good about it?
                        </legend>

                        <label class="option">
                            <input
                                type="checkbox"
                                name="features[]"
                                value="affordable"
                            >
                            Affordable
                        </label>

                        <label class="option">
                            <input
                                type="checkbox"
                                name="features[]"
                                value="good-wifi"
                            >
                            Good WiFi
                        </label>

                        <label class="option">
                            <input
                                type="checkbox"
                                name="features[]"
                                value="quiet"
                            >
                            Quiet
                        </label>
                    </fieldset>
                </div>

                <div class="form-group">
                    <label for="email">
                        Contact Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">
                    Submit Suggestion
                </button>

            </form>

        </section>

    </main>

</body>
</html>
